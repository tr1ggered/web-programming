<tspan x="650" y="892.3199999999999" dominant-baseline="middle">банкоматом</tspan>
</text>
<text text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#0f172a">
<tspan x="650" y="690.0" dominant-baseline="middle">Карта забрана</tspan>
</text>
<text text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#0f172a">
<tspan x="650" y="498.84" dominant-baseline="middle">Наличные</tspan>
<tspan x="650" y="521.16" dominant-baseline="middle">выданы</tspan>
</text>
<text text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#0f172a">
<tspan x="650" y="318.84" dominant-baseline="middle">Деньги забраны</tspan>
<tspan x="650" y="341.15999999999997" dominant-baseline="middle">и пересчитаны</tspan>
</text>
<text text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#0f172a">
<tspan x="650" y="127.68" dominant-baseline="middle">Выход из</tspan>
<tspan x="650" y="150.0" dominant-baseline="middle">отделения с</tspan>
<tspan x="650" y="172.32" dominant-baseline="middle">деньгами</tspan>
</text>
<text text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#0f172a">
<tspan x="350" y="229.46" dominant-baseline="middle">T0: Подойти и</tspan>
<tspan x="350" y="250.54000000000002" dominant-baseline="middle">вставить карту</tspan>
</text>
<text text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#0f172a">
<tspan x="350" y="409.46" dominant-baseline="middle">T1: Ввести PIN;</tspan>
<tspan x="350" y="430.53999999999996" dominant-baseline="middle">проверить PIN</tspan>
</text>
<text text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#0f172a">
<tspan x="350" y="589.46" dominant-baseline="middle">T2: PIN верен:</tspan>
<tspan x="350" y="610.5400000000001" dominant-baseline="middle">открыть меню</tspan>
</text>
<text text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#0f172a">
<tspan x="350" y="769.46" dominant-baseline="middle">T3: Выбрать</tspan>
<tspan x="350" y="790.5400000000001" dominant-baseline="middle">снятие наличных</tspan>
</text>
<text text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#0f172a">
<tspan x="350" y="938.92" dominant-baseline="middle">T4: Ввести</tspan>
<tspan x="350" y="960.0" dominant-baseline="middle">сумму; проверить</tspan>
<tspan x="350" y="981.0799999999999" dominant-baseline="middle">её</tspan>
</text>
<text text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#0f172a">
<tspan x="480" y="1248.92" dominant-baseline="middle">T5: Сумма</tspan>
<tspan x="480" y="1270.0" dominant-baseline="middle">допустима:</tspan>
<tspan x="480" y="1291.0800000000002" dominant-baseline="middle">разрешить снятие</tspan>
</text>
<text text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#0f172a">
<tspan x="890" y="938.92" dominant-baseline="middle">T6: Завершить</tspan>
<tspan x="890" y="960.0" dominant-baseline="middle">операцию;</tspan>
<tspan x="890" y="981.0799999999999" dominant-baseline="middle">вернуть карту</tspan>
</text>
<text text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#0f172a">
<tspan x="890" y="769.46" dominant-baseline="middle">T7: Забрать</tspan>
<tspan x="890" y="790.5400000000001" dominant-baseline="middle">карту</tspan>
</text>
<text text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#0f172a">
<tspan x="890" y="589.46" dominant-baseline="middle">T8: Выдать</tspan>
<tspan x="890" y="610.5400000000001" dominant-baseline="middle">наличные</tspan>
</text>
<text text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#0f172a">
<tspan x="890" y="398.92" dominant-baseline="middle">T9: Забрать и</tspan>
<tspan x="890" y="420.0" dominant-baseline="middle">пересчитать</tspan>
<tspan x="890" y="441.08000000000004" dominant-baseline="middle">деньги</tspan>
</text>
<text text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#0f172a">
<tspan x="890" y="218.92000000000002" dominant-baseline="middle">T10: Убрать</tspan>
<tspan x="890" y="240.0" dominant-baseline="middle">деньги и карту;</tspan>
<tspan x="890" y="261.08000000000004" dominant-baseline="middle">выйти</tspan>
</text>
<text text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#0f172a">
<tspan x="490" y="370.84" dominant-baseline="middle">Повторный ввод</tspan>
<tspan x="490" y="393.15999999999997" dominant-baseline="middle">PIN разрешён</tspan>
</text>
<text text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#0f172a">
<tspan x="355" y="543.46" dominant-baseline="middle">T11: Первый PIN</tspan>
<tspan x="355" y="564.5400000000001" dominant-baseline="middle">неверен</tspan>
</text>
<text text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#0f172a">
<tspan x="505" y="572.92" dominant-baseline="middle">T12: Повторно</tspan>
<tspan x="505" y="594.0" dominant-baseline="middle">ввести верный</tspan>
<tspan x="505" y="615.0799999999999" dominant-baseline="middle">PIN</tspan>
</text>
<text text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#0f172a">
<tspan x="470" y="1058.92" dominant-baseline="middle">T13: Сумма</tspan>
<tspan x="470" y="1080.0" dominant-baseline="middle">недопустима:</tspan>
<tspan x="470" y="1101.0800000000002" dominant-baseline="middle">запросить другую</tspan>

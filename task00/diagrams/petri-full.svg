<text text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="23" fill="#0f172a">
<tspan x="525.0" y="30.0" dominant-baseline="middle">Полная сеть Петри — снятие наличных</tspan>
</text>
<text text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="16" fill="#0f172a">
<tspan x="525.0" y="63.0" dominant-baseline="middle">● — начальный маркер; P — позиции; T — переходы. Основной путь: вниз слева, вверх справа.</tspan>
</text>
<text text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#0f172a">
<tspan x="95" y="127.68" dominant-baseline="middle">Свободный</tspan>
<tspan x="95" y="150.0" dominant-baseline="middle">банкомат</tspan>
<tspan x="95" y="172.32" dominant-baseline="middle">найден</tspan>
</text>
<text text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#0f172a">
<tspan x="95" y="318.84" dominant-baseline="middle">Карта принята;</tspan>
<tspan x="95" y="341.15999999999997" dominant-baseline="middle">ожидается PIN</tspan>
</text>
<text text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#0f172a">
<tspan x="95" y="498.84" dominant-baseline="middle">Первый PIN</tspan>
<tspan x="95" y="521.16" dominant-baseline="middle">проверен</tspan>
</text>
<text text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#0f172a">
<tspan x="95" y="678.84" dominant-baseline="middle">Открыто меню</tspan>
<tspan x="95" y="701.1600000000001" dominant-baseline="middle">операций</tspan>
</text>
<text text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#0f172a">
<tspan x="95" y="836.52" dominant-baseline="middle">Выбрано</tspan>
<tspan x="95" y="858.84" dominant-baseline="middle">снятие;</tspan>
<tspan x="95" y="881.16" dominant-baseline="middle">ожидается</tspan>
<tspan x="95" y="903.48" dominant-baseline="middle">сумма</tspan>
</text>
<text text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#0f172a">
<tspan x="95" y="1038.84" dominant-baseline="middle">Сумма</tspan>
<tspan x="95" y="1061.1599999999999" dominant-baseline="middle">проверена</tspan>
</text>
<text text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#0f172a">
<tspan x="650" y="1038.84" dominant-baseline="middle">Снятие</tspan>
<tspan x="650" y="1061.1599999999999" dominant-baseline="middle">разрешено</tspan>
</text>
<text text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#0f172a">
<tspan x="650" y="847.68" dominant-baseline="middle">Карта</tspan>
